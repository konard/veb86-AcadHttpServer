# CI: build + tests on Windows (net48 / net8.0) and Linux (net8.0) for pull requests and pushes to main.
# GitHub Releases (AutoCADHttp.zip) are published by build-release.yml.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build DLL + tests (Windows, net48 / net8.0)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build (Release, x64)
        run: dotnet build AutoCADHttp.sln -c Release

      - name: Test (.NET Framework 4.8 and .NET 8)
        run: dotnet test AutoCADHttp.sln -c Release --no-build --logger "console;verbosity=normal"
        timeout-minutes: 5

      - name: Check DLL
        shell: powershell # Windows PowerShell (.NET Framework) reports ProcessorArchitecture correctly
        run: |
          $dll = "src/AutoCADHttp/bin/Release/AutoCADHttp.dll"
          if (!(Test-Path $dll)) { throw "$dll not found" }
          $asm = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $dll))
          Write-Host "Assembly: $($asm.FullName), architecture: $($asm.ProcessorArchitecture)"
          if ($asm.ProcessorArchitecture -ne 'Amd64') { throw "Expected x64 (Amd64) assembly" }
          if (Test-Path "src/AutoCADHttp/bin/Release/acmgd.dll") { throw "AutoCAD DLLs must not be copied to the output" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item src/AutoCADHttp/bin/Release/AutoCADHttp.dll artifacts/
          Copy-Item src/AutoCADHttp/bin/Release/AutoCADHttp.pdb artifacts/
          Copy-Item README.md artifacts/
          Copy-Item examples/check-ping.ps1 artifacts/

      - uses: actions/upload-artifact@v6
        with:
          name: AutoCADHttp-AutoCAD2021-x64
          path: artifacts/

  linux:
    name: Tests (Linux, net8.0) + DLL build check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build AutoCADHttp.sln -c Release

      - name: Test
        run: dotnet test AutoCADHttp.sln -c Release --no-build --logger "console;verbosity=normal"
        timeout-minutes: 5

      - name: End-to-end IPC and widgets (standalone host)
        run: |
          dotnet build examples/StandaloneHost -c Release
          python3 experiments/verify-stage2.py
        timeout-minutes: 2

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: stage2-diagnostics
          path: ci-logs/
          if-no-files-found: ignore
